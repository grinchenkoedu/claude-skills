schema_version: "1.1"
name: fix-red-first
description: "/gku:fix shows its test failing before the fix and passing after it."
tags: [fix]
plugins: ["../../../plugins/gku"]
runs: 1
execution:
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Bash, Read, Grep, Glob, Skill, Edit, Write, Agent]
  prompt: "/gku:fix clamp 15 0 10 prints 0, it should print 10"
context:
  scaffold_script: setup.sh
graders:
  # The judge of an llm grader sees only the first and last 12 messages of a
  # trace, and the red run sits in the middle; these two see all of it.
  - name: red-run-printed
    type: regex
    target: trace
    pattern: '"stdout":"(?:[^"\\]|\\.)*FAIL clamp above'
  - name: tests-run-before-the-edit
    type: tool_order
    before: { tool: Bash, input_match: 'tests/run\.sh' }
    after: { tool: Edit, input_match: 'lib/math\.sh' }
  - name: reports-both-lines
    type: llm
    criteria: "The final report quotes the test's failing result from before the fix and its passing result after it."
