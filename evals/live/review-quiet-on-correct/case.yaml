schema_version: "1.1"
name: review-quiet-on-correct
description: "/gku:review stays quiet on a correct, tested and input-checked change: its verdict is Ready to push — no blocker, no warning; nits allowed."
tags: [review]
plugins: ["../../../plugins/gku"]
runs: 1
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Grep, Glob, Skill, Edit, Write]
  prompt: "/gku:review"
context:
  scaffold_script: setup.sh
graders:
  # The verdict, not a judge: /gku:review step 6 says "Ready to push" only with no blocker and
  # no warning, and the judge this replaces split its votes on near-identical replies. Anchored
  # to the start, where the verdict leads: unanchored, "ready to push once that is fixed" after a
  # blocker would pass.
  - name: verdict-ready-to-push
    type: regex
    target: last_message
    pattern: '^\W*Ready to push'
    flags: i
  - name: read-only
    type: tool_used
    tool: Edit
    min: 0
    max: 0
