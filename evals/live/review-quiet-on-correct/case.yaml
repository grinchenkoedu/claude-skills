schema_version: "1.1"
name: review-quiet-on-correct
description: "/gku:review stays quiet on a correct, tested change: no blocker, no invented defect."
tags: [review]
plugins: ["../../../plugins/gku"]
runs: 1
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Grep, Glob, Skill, Edit, Write]
  prompt: "/gku:review"
context:
  scaffold_script: setup.sh
graders:
  - name: no-invented-defect
    type: llm
    criteria: "The review raises no BLOCKER and does not claim that percent or its tests are wrong. Nits, style remarks and suggestions are acceptable; a claimed bug in correct code fails."
  - name: read-only
    type: tool_used
    tool: Edit
    min: 0
    max: 0
