name: checks

# The skills are markdown and shell, so the checks are: do the rules the skills
# state still hold, does the shell parse cleanly, and does the plugin still load.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  evals:
    name: eval suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash evals/run-all.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest ships shellcheck (0.9.0 on the 24.04 image), so there is
      # nothing to install. severity=warning for two reasons: the info notices
      # on these files are deliberate — single-quoted greps that must not
      # expand, ls where a count is all that is wanted — and a newer shellcheck
      # than the runner's would otherwise fail a build by adding notices.
      - run: shellcheck --severity=warning plugins/gku/scripts/*.sh plugins/gku/bin/* evals/*.sh evals/*/*.sh

  plugin:
    name: plugin validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Deliberately unpinned: the job asks whether the plugin still loads in the
      # CLI people actually run, and a pinned version quietly stops asking. The
      # cost is that a bad upstream release fails a build nobody changed — which
      # is visible, and passes again when upstream fixes it.
      - run: npm install -g @anthropic-ai/claude-code
      # No credentials: validate reads the manifest and the skills off disk.
      # The version and author warnings are expected and do not fail the run.
      - run: claude plugin validate . && claude plugin validate plugins/gku
